apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: myapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myapp
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource      ### HPA will be measure CPU Utilization to know when to scale 
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50      # Scale when CPU usage exceeds 50%
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70  # Scale when Memory usage exceeds 70%