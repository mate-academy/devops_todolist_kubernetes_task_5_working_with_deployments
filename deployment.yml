apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 2             ### How many containers will be created as a default 
  selector:
    matchLabels:          ### deployment looking for labels to know what he's managing
      app: myapp
  template:               ### Template of our app pod Deployment using to scale 
    metadata:
      labels:
        app: myapp        ### label for deployment to look up
    spec:
      containers:
      - name: todoapp
        resources:          ### Resources we need to give this container limits so he have no more no less 
          requests:
            memory: "64Mi"
            cpu: "30m"
          limits:
            memory: "128Mi"
            cpu: "50m"
        livenessProbe:
            httpGet:
              path: api/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 5
        readinessProbe:
          httpGet:
            path: api/ready
            port: 8080
        image: ikulyk404/todoapp:3.0.0
        imagePullPolicy: Always
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
