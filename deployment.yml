apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-service
  namespace: mateapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: example
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
        - name: example-container
          image: nginx
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
