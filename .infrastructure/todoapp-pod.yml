apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: mateapp
  labels:
    app: todoapp
spec:
  containers:
    - name: todoapp
      image: vsupruniuk/todoapp:3.0.0
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      env:
        - name: PYTHONUNBUFFERED
          value: "1"
      ports:
        - containerPort: 8080
      livenessProbe:
        httpGet:
          path: /api/live/
          port: 8080
        initialDelaySeconds: 60
        periodSeconds: 5
      readinessProbe:
        httpGet:
          path: /api/ready/
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5

