apiVersion: autostacling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: todoapp
  namespace: mateapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: todoapp
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resources:
        name: cpu
        target:
          types: Utilization
          averageUtilization: 70
    - type: Resource
      resources:
        name: memory
        target:
          types: Utilization
          averageUtilization: 70