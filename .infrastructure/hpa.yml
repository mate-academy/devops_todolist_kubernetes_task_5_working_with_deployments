apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: todoapp-hpa
  namespace: mateapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: todoapp-deployment  # ім'я deployment
  minReplicas: 2  # мінімальна кількість pod
  maxReplicas: 5  # максимальна кількість pod
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50  # 50% використання CPU
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 50  # 50% використання пам'яті
