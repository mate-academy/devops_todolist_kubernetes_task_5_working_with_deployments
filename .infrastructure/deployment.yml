apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp-deploy
  namespace: mateapp
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: todoapp-deploy
  template:
    metadata:
      labels:
        app: todoapp-deploy
    spec:
      containers:
      - name: todoapp
        image: ikulyk404/todoapp:3.0.0
        resources:
          requests: 
            memory: "120Mi"
            cpu: "100m"
          limits:
            memory: "250Mi"
            cpu: "150m"
        ports: 
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: api/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: api/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
