apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp
  namespace: my-namespace
spec:
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  replicas: 2
  selector:
    matchLabels:
      app: todolist
  template:
    metadata:
      labels:
        app: todolist
    spec:
      containers:
        - name: todoapp
          image: bodya4243/todoapp:1.0.1
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          ports:
            - containerPort: 8080
          env:
            - name: EXTERNAL_ENDPOINT
              value: "http://httpbin-api.mateapp.svc.cluster.local"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
